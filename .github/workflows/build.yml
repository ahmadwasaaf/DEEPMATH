name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        env:
          BS_DEMO_DB: ${{ runner.temp }}\Demo Database
        run: dotnet test tests/BatchStudio.Core.Tests/BatchStudio.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish app
        if: hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        run: dotnet publish src/BatchStudio.App/BatchStudio.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish

      - name: Smoke test with screenshots
        if: hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $cfg = Join-Path $env:APPDATA 'BATCH STUDIO'
          New-Item -ItemType Directory -Force $cfg | Out-Null
          $db = Join-Path $env:RUNNER_TEMP 'Demo Database'
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD "shots\$name.png"))
          }
          function Run($lang, $theme, $withEntity, $page, $name) {
            $s = @{ Language = $lang; Theme = $theme; AutoSave = $true; KeepBackups = 30; Entities = @(); ActiveEntity = $null }
            if ($withEntity) { $s.Entities = @(@{ Name = 'Demo'; DatabasePath = $db; LastOpenedUtc = '2026-01-01T00:00:00Z' }); $s.ActiveEntity = 'Demo' }
            $s | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $cfg 'settings.json') -Encoding utf8
            $args = @(); if ($page) { $args = @('--page', $page) }
            $p = if ($args.Count) { Start-Process publish\BatchStudio.exe -ArgumentList $args -PassThru } else { Start-Process publish\BatchStudio.exe -PassThru }
            Start-Sleep -Seconds 14
            Shot $name
            $alive = -not $p.HasExited
            if ($alive) { Stop-Process $p -Force; Start-Sleep -Seconds 2 }
            $log = Join-Path $cfg 'error.log'
            if (Test-Path $log) { Write-Host "---- error.log after $name ----"; Get-Content $log; Remove-Item $log }
            if (-not $alive) { Write-Host "::warning::app exited early in $name" }
          }
          Run 'English' 'Dark' $false $null '1-setup'
          Run 'English' 'Dark' $true $null '2-home-dark'
          Run 'English' 'Dark' $true 'suppliers' '3-suppliers'
          Run 'English' 'Dark' $true 'templates' '4-templates'
          Run 'Arabic' 'Light' $true $null '5-home-ar-light'
          Run 'Arabic' 'Light' $true 'suppliers' '6-suppliers-ar'
          Run 'English' 'Dark' $true 'settings' '7-settings'

      - name: Upload screenshots
        if: always() && hashFiles('shots/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

      - name: Build installer
        if: hashFiles('installer/BatchStudio.iss') != '' && hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\publish" "/O$PWD\out" installer\BatchStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        if: hashFiles('out/*.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BatchStudio-Setup
          path: out/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('out/*.exe') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
