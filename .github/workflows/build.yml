name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        env:
          BS_DEMO_DB: ${{ runner.temp }}\Demo Database
          BS_SAMPLE_OUT: ${{ github.workspace }}\shots
        run: dotnet test tests/BatchStudio.Core.Tests/BatchStudio.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish app
        if: hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        run: dotnet publish src/BatchStudio.App/BatchStudio.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish

      - name: Smoke test with screenshots
        if: hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          $cfg = Join-Path $env:APPDATA 'BATCH STUDIO'
          New-Item -ItemType Directory -Force $cfg | Out-Null
          $db = Join-Path $env:RUNNER_TEMP 'Demo Database'
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD "shots\$name.png"))
          }
          function Run($lang, $theme, $withEntity, $page, $name) {
            $s = @{ Language = $lang; Theme = $theme; AutoSave = $true; KeepBackups = 30; Entities = @(); ActiveEntity = $null }
            if ($withEntity) { $s.Entities = @(@{ Name = 'Demo'; DatabasePath = $db; LastOpenedUtc = '2026-01-01T00:00:00Z' }); $s.ActiveEntity = 'Demo' }
            $s | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $cfg 'settings.json') -Encoding utf8
            $argv = @(); if ($page) { $argv = @("--page", $page) }
            $p = if ($argv.Count) { Start-Process publish\BatchStudio.exe -ArgumentList $argv -PassThru } else { Start-Process publish\BatchStudio.exe -PassThru }
            Start-Sleep -Seconds 14
            Shot $name
            $alive = -not $p.HasExited
            if ($alive) { Stop-Process $p -Force; Start-Sleep -Seconds 2 }
            $log = Join-Path $cfg 'error.log'
            if (Test-Path $log) { Write-Host "---- error.log after $name ----"; Get-Content $log; Remove-Item $log }
            if (-not $alive) { Write-Host "::warning::app exited early in $name" }
          }
          Run 'English' 'Dark' $false $null '1-setup'
          Run 'English' 'Dark' $true $null '2-home-dark'
          Run 'English' 'Dark' $true 'suppliers' '3-suppliers'
          Run 'English' 'Dark' $true 'templates' '4-templates'
          Run 'Arabic' 'Light' $true $null '5-home-ar-light'
          Run 'Arabic' 'Light' $true 'suppliers' '6-suppliers-ar'
          Run 'English' 'Dark' $true 'settings' '7-settings'
          Run 'English' 'Dark' $true 'newinvoice' '8-new-invoice'
          Run 'Arabic' 'Dark' $true 'newinvoice' '9-new-invoice-ar'
          Run 'English' 'Dark' $true 'history' '10-history'
          Run 'Arabic' 'Light' $true 'history' '11-history-ar'
          Run 'English' 'Dark' $true 'dashboard' '12-dashboard'
          Run 'Arabic' 'Light' $true 'dashboard' '13-dashboard-ar'
          Run 'English' 'Dark' $true 'newparty' '14-new-party'
          Run 'English' 'Dark' $true 'clients' '15-clients'
          Run 'English' 'Dark' $true 'reportview' '16-reports'
          Run 'Arabic' 'Light' $true 'reports' '17-reports-ar'
          Run 'English' 'Dark' $true 'mass' '18-mass'
          Run 'Arabic' 'Light' $true 'mass' '19-mass-ar'
          Run 'English' 'Dark' $true 'home-sphere' '20-bg-sphere'
          Run 'English' 'Dark' $true 'home-waves' '21-bg-waves'
          Run 'English' 'Dark' $true 'home-datastream' '22-bg-stream'
          Run 'English' 'Dark' $true 'newinvoice-details' '23-newinvoice-details'
          Run 'English' 'Dark' $true 'settings-accent' '24-accent-dark'
          Run 'English' 'Light' $true 'settings-accent' '25-accent-light'
          Run 'English' 'Dark' $true 'suppliers-wide' '26-suppliers-wide'
          Run 'English' 'Dark' $true 'suppliers-banks' '27-suppliers-banks'
          Run 'English' 'Dark' $true 'newinvoice-banks' '28-newinvoice-banks'
          Run 'English' 'Dark' $true 'colorpicker' '29-colorpicker'
          Run 'English' 'Light' $true 'colorpicker' '30-colorpicker-light'
          Run 'Arabic' 'Dark' $true 'suppliers-banks' '31-suppliers-banks-ar'
          Run 'English' 'Dark' $true 'mass-newparty' '32-mass-newparty'
          Run 'English' 'Dark' $true 'newinvoice-banks' '33-newinvoice-pager'
          Run 'English' 'Dark' $true 'suppliers-search2' '34-suppliers-search2'
          Run 'English' 'Dark' $true 'mass-details' '35-mass-details'

      - name: Upload screenshots
        if: always() && hashFiles('shots/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

      - name: Publish screenshots to branch
        if: always() && github.event_name == 'push' && hashFiles('shots/*.png', 'shots/*.xlsx') != ''
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'shots-branch'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item shots\*.png $tmp -ErrorAction SilentlyContinue
          Copy-Item shots\*.xlsx $tmp -ErrorAction SilentlyContinue
          $url = git config --get remote.origin.url
          $auth = git config --get http.https://github.com/.extraheader
          Push-Location $tmp
          git init -q -b screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "screenshots for $env:GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=$auth" push -f -q $url screenshots
          Pop-Location

      - name: Build installer
        id: installer
        if: hashFiles('installer/BatchStudio.iss') != '' && hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\publish" "/O$PWD\out" installer\BatchStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        if: hashFiles('out/*.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: DEEPMATH-Setup
          path: out/*.exe

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('out/*.exe') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.installer.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DEEPMATH ${{ steps.installer.outputs.version }}
          body: Download **DEEPMATH-Setup-${{ steps.installer.outputs.version }}.exe** below and run it.
          files: out/*.exe
          overwrite_files: true
          make_latest: true
