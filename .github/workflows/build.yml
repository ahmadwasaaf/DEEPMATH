name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        run: dotnet test tests/BatchStudio.Core.Tests/BatchStudio.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish app
        if: hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        run: dotnet publish src/BatchStudio.App/BatchStudio.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish

      - name: Build installer
        if: hashFiles('installer/BatchStudio.iss') != '' && hashFiles('src/BatchStudio.App/BatchStudio.App.csproj') != ''
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\publish" "/O$PWD\out" installer\BatchStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        if: hashFiles('out/*.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BatchStudio-Setup
          path: out/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('out/*.exe') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
